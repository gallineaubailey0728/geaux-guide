<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSUA Campus Navigator V13 — Building Label Alignment</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#32164c}header{background:#35105d;color:white;padding:14px 18px;display:flex;justify-content:space-between;gap:10px}header b{font-size:20px}header strong{color:#ffd246}main{display:grid;grid-template-columns:minmax(0,1fr) 365px;height:calc(100dvh - 55px)}#map{position:relative;background:#d1dec8}.controls{position:absolute;z-index:4;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap}.controls input{flex:1;min-width:140px;padding:12px;border-radius:9px;border:1px solid #ccc;font:inherit;box-shadow:0 2px 9px #0002}button{border:0;background:#ffce35;color:#30114e;font-weight:750;padding:11px;border-radius:8px;cursor:pointer}.soft{background:#eee7f4}.panel{padding:16px;overflow:auto;background:white}.tabs{display:flex;gap:6px}.tabs button{flex:1;background:#eee7f4}.tabs .active{background:#35105d;color:white}.entry{border:1px solid #e6dced;border-radius:9px;padding:11px;margin:8px 0;cursor:pointer}.entry:hover{border-color:#a06dc0;background:#f7f2fa}.muted{font-size:13px;color:#6c6078;line-height:1.5}.notice{position:absolute;bottom:14px;left:12px;max-width:390px;background:#fffffff0;padding:9px;border-radius:8px;font-size:12px;z-index:3}.building-marker{border:2px solid #fff;background:#35105de8;color:white;border-radius:8px;padding:5px 8px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 7px #0008;max-width:210px;overflow:hidden;text-overflow:ellipsis;font-size:12px}.building-marker:hover,.building-marker:focus{background:#ffd23f;color:#30114e;border-color:#35105d;transform:scale(1.08);z-index:20}.maplibregl-marker{z-index:2}.maplibregl-marker:hover{z-index:10}.photo{width:100%;max-height:175px;object-fit:cover;border-radius:10px}.note{background:#fff8dd;padding:10px;border-radius:8px;font-size:12px;line-height:1.5}.maplibregl-popup-content{border-radius:10px;font:13px system-ui}.maplibregl-popup-content button{margin-top:7px}@media(max-width:740px){main{display:flex;flex-direction:column}#map{height:62dvh;flex-shrink:0}.panel{flex:1}header b{font-size:17px}.controls{right:60px}.controls button{padding:9px}} .maplibregl-marker{pointer-events:auto}.building-marker{transition:background .12s,transform .12s}.building-marker:hover{outline:3px solid #ffcd36}.controls label{background:#fff;border-radius:9px;padding:9px;font-size:12px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 9px #0002}.legend{font-size:12px;background:#f8f2ff;padding:9px;border-radius:8px}.entry button{padding:6px 9px;font-size:12px;margin-top:6px}.building-marker:focus-visible{outline:3px solid gold} </style></head><body><header><b><strong>LSUA</strong> Campus Navigator</b><span>Find your way, faster</span></header><main><div id="map"><div class="controls"><input id="search" placeholder="Find buildings, advisors, departments…" aria-label="Search"><button id="locate">My location</button><button id="reset" class="soft">Reset</button><button id="editPins" class="soft" title="Drag labels onto their correct roofs">Adjust labels</button><button id="exportPins" class="soft" style="display:none">Export positions</button><label><input type="checkbox" id="labels" checked style="width:auto;min-width:0;flex:none">Show map labels</label></div><div class="notice" id="status">Building directory ready. Loading satellite map…</div></div><aside class="panel"><div class="tabs"><button class="active" data-tab="buildings">Buildings</button><button data-tab="advisors">Advisors</button><button data-tab="directions">Directions</button></div><section id="content"></section></aside></main><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const center=[-92.4145,31.1785],$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Names are sourced from LSUA's official campus map. Coordinates are only included where
// available and are explicitly APPROXIMATE map anchors, not roof outlines or navigation points.
const groups={
'Academics':['AC Buchanan Allied Health Building','Avoyelles Hall','Chambers Hall','F. Hugh Coughlin Hall','James C. Bolton Library','Martin Family Student Success Center','Mulder Hall','Science Building'],
'Administration':['Abrams Hall','Facility Services','Oakland Hall'],
'Athletics':['Baseball Field','Soccer Fields','Softball Field','Tennis Courts','The Fort'],
'Student Life':['Alexandria Museum of Art','Barnes & Noble Bookstore','Burger 318','Children’s Center','Disc Golf Course','Magnolia Cafe','Student Center','The Oaks Residence Hall','The Quad','Walking Trail'],
'Parking':['Lot 01','Lot 02','Lot 03','Lot 05','Lot 06','Lot 07','Lot 08','Lot 09','Lot 11','Lot 17','Lot 22'],
'Other':['Bo Nipper Technology Center','Brumfield Caffey Ballroom','Epps House','LSUA Foundation','LSUA Plaza','University Police'],
'Tank’s Taxi':['Alpha Stop','Bravo Stop','Charlie Stop','Delta Stop','Echo Stop']};
const buildings=Object.entries(groups).flatMap(([category,names])=>names.map(name=>({name,category})));
// These are approximate published address points, not precise roof centers. The prior
// Chambers Hall label was incorrectly positioned and is intentionally not reintroduced.
const anchors={};
const overviewPositions={"Martin Family Student Success Center": [0.608, 0.586], "Abrams Hall": [0.558, 0.541], "LSUA Plaza": [0.539, 0.616], "Chambers Hall": [0.465, 0.574], "F. Hugh Coughlin Hall": [0.467, 0.522], "Science Building": [0.44, 0.465], "Disc Golf Course": [0.403, 0.496], "James C. Bolton Library": [0.539, 0.469], "Avoyelles Hall": [0.493, 0.413], "Burger 318": [0.47, 0.403], "The Fort": [0.551, 0.366], "Baseball Field": [0.446, 0.331], "Softball Field": [0.496, 0.303], "Tennis Courts": [0.59, 0.354], "Mulder Hall": [0.651, 0.411], "LSUA Foundation": [0.658, 0.492], "Brumfield Caffey Ballroom": [0.616, 0.468], "Student Center": [0.6, 0.511], "Barnes & Noble Bookstore": [0.583, 0.505], "Magnolia Cafe": [0.615, 0.487], "University Police": [0.797, 0.417], "Soccer Fields": [0.791, 0.485], "Bo Nipper Technology Center": [0.783, 0.606], "The Oaks Residence Hall": [0.876, 0.542], "Oakland Hall": [0.526, 0.55], "Facility Services": [0.742, 0.525], "Epps House": [0.805, 0.538], "Alpha Stop": [0.845, 0.593], "Bravo Stop": [0.629, 0.505], "Charlie Stop": [0.519, 0.443], "Delta Stop": [0.481, 0.498], "Echo Stop": [0.554, 0.604], "AC Buchanan Allied Health Building": [0.805, 0.55], "Children's Center": [0.812, 0.559], "The Quad": [0.555, 0.485], "Walking Trail": [0.34, 0.515], "Lot 01": [0.52, 0.63], "Lot 02": [0.39, 0.51], "Lot 03": [0.59, 0.65], "Lot 05": [0.7, 0.61], "Lot 06": [0.73, 0.67], "Lot 07": [0.8, 0.58], "Lot 08": [0.67, 0.54], "Lot 09": [0.64, 0.46], "Lot 11": [0.55, 0.43], "Lot 17": [0.87, 0.63], "Lot 22": [0.52, 0.37]};
function approxCoordinate(name){if(savedPositions[name])return savedPositions[name];const p=overviewPositions[name];if(!p)return null;return [-92.4162+(p[0]-.526)*.022,31.1779-(p[1]-.550)*.012];}
const advisors=[['Daniel Manuel','Director of Advising'],['Georgia Fox','Science, Technology & Mathematics'],['Hannah Waters','Allied Health, Kinesiology, Education'],['Alexandra Hammond','Social Sciences'],['A’lysse Wallace','Undecided and Liberal Arts'],['Tiffany Treloar','College of Business'],['Abbey Youngblood','Nursing'],['Dane Ervin','Biology and Psychology'],['Jennifer Parish','Science, Technology & Mathematics; Business'],['Nannette Hill','Upper-level Accounting and Finance'],['Annsia Moton','Upper-level Management and Marketing'],['Ashleigh Sylvia','Allied Health'],['Jimena Valle','Health and Human Services'],['Samantha Mitchell','Social Sciences'],['Katie Williams','Science, Technology & Mathematics'],['Harlee Mitchell','Science, Technology & Mathematics']];
let editMode=false;const savedPositions=(()=>{try{return JSON.parse(localStorage.getItem("lsua_verified_positions_v13")||"{}")}catch{return {}}})();const markerByName={};let map,tab='buildings',markers=[],selected=null;
function tabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function detail(name){const b=buildings.find(b=>b.name===name);if(!b)return;selected=b;tab='buildings';tabs();$('content').innerHTML=`<button id="back" class="soft">← All campus locations</button><h2>${esc(name)}</h2><p class="muted">${esc(b.category)} · LSUA official campus directory</p><div class="note">${savedPositions[name]?'Position adjusted locally on this device; not independently verified.':overviewPositions[name]?'Approximate position estimated from LSUA’s official campus overview. NOT verified as the correct satellite roof.':'No on-campus marker is available for this location.'}</div><h3>See advisors and teachers in this building</h3><p class="muted">Individual advisor and faculty building assignments are not verified yet. Names are available under the Advisors tab; we will not assign them to the wrong building.</p><p class="muted">No office hours are shown.</p>`;$('back').onclick=()=>{selected=null;render()};if(map&&approxCoordinate(name))map.flyTo({center:approxCoordinate(name),zoom:18.2,duration:350})}
function render(){const q=$('search').value.toLowerCase().trim();if(tab==='buildings'){$('content').innerHTML='<h2>LSUA campus locations</h2><div class="legend">48 official campus locations. Satellite imagery is real. Hide labels to reduce clutter. Some labels are approximate. Select Adjust labels, drag each label onto its correct roof, then select Finish adjusting. Corrections are saved on this device. Verify before publishing. Choose any building to see its directory.</div>'+buildings.filter(b=>(b.name+' '+b.category).toLowerCase().includes(q)).map(b=>`<div class="entry" data-building="${esc(b.name)}"><b>${esc(b.name)}</b><div class="muted">${esc(b.category)} · ${savedPositions[b.name]?'Position adjusted locally':overviewPositions[b.name]?'Approximate map label':'Directory only'}</div></div>`).join('');}else if(tab==='advisors'){$('content').innerHTML='<h2>Find an advisor</h2><p class="muted">Names and advising specialties are included here. Individual office locations require confirmation; no office hours.</p>'+advisors.filter(a=>a.join(' ').toLowerCase().includes(q)).map(a=>`<div class="entry"><b>${esc(a[0])}</b><div class="muted">${esc(a[1])}<br>Building and room: not verified</div></div>`).join('');}else{$('content').innerHTML='<h2>Directions</h2><p class="muted">Use My location to request GPS permission. Walking paths and building entrances have not yet been surveyed, so turn-by-turn directions are disabled.</p>';}}
$('content').addEventListener('click',e=>{const b=e.target.closest('[data-building]');if(b)detail(b.dataset.building)});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=null;tabs();render()});
$('search').oninput=()=>{selected=null;render()};$('labels').onchange=e=>markers.forEach(m=>m.getElement().style.display=e.target.checked?'':'none');
$('reset').onclick=()=>map?.flyTo({center,zoom:17.2,pitch:0,bearing:0,duration:350});
$('locate').onclick=()=>{if(!navigator.geolocation){$('status').textContent='Location unavailable in this browser';return}navigator.geolocation.getCurrentPosition(p=>{if(map){new maplibregl.Marker({color:'#ffcf35'}).setLngLat([p.coords.longitude,p.coords.latitude]).addTo(map);map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:18})}$('status').textContent='GPS location shown privately. May be inaccurate indoors.'},e=>$('status').textContent='Location unavailable: '+e.message+'. Try HTTPS.',{timeout:10000})};
$('editPins').onclick=()=>{
 editMode=!editMode;
 $('editPins').textContent=editMode?'Finish adjusting':'Adjust labels';
 $('exportPins').style.display=editMode?'':'none';
 Object.values(markerByName).forEach(m=>m.setDraggable(editMode));
 $('status').textContent=editMode?'EDIT MODE: drag each label onto its actual building roof. Drag the MAP from empty space. Changes save locally.':'Explore mode. Labels can be clicked to open building details.';
};
$('exportPins').onclick=()=>{
 const blob=new Blob([JSON.stringify(savedPositions,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lsua-corrected-building-coordinates.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
render();
if(window.maplibregl){
 try {
  map=new maplibregl.Map({container:'map',center,zoom:17.2,pitch:0,bearing:0,minZoom:15.8,maxZoom:20,maxBounds:[[-92.424,31.172],[-92.406,31.186]],style:{version:8,sources:{satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'© Esri and imagery contributors'}},layers:[{id:'satellite',type:'raster',source:'satellite'}]}});
  map.addControl(new maplibregl.NavigationControl(),'bottom-right');
  map.on('load',()=>{
   $('status').textContent='Satellite ready. Use Adjust labels to place each name directly over its correct roof. Approximate labels are not verified.';
   for(const name of Object.keys(overviewPositions)){
    const coord=approxCoordinate(name);
    if(!coord)continue;
    const el=document.createElement('button');
    el.className='building-marker';el.textContent=name;
    el.title=name+' — '+(savedPositions[name]?'locally adjusted position':'approximate position, adjust before publishing');
    el.addEventListener('click',()=>{if(!editMode)detail(name)});
    const marker=new maplibregl.Marker({element:el,anchor:'center',draggable:false}).setLngLat(coord).addTo(map);
    marker.on('dragend',()=>{savedPositions[name]=marker.getLngLat().toArray();try{localStorage.setItem("lsua_verified_positions_v13",JSON.stringify(savedPositions))}catch(e){};$('status').textContent=name+' position saved on this browser. Continue adjusting, then export.';});
    markerByName[name]=marker;markers.push(marker);
   }
   $('labels').dispatchEvent(new Event('change'));
  });
  map.on('error',()=>{$('status').textContent='Satellite imagery may be unavailable. Try hosting this site via HTTPS; the directory is still usable.'});
 }catch(e){$('status').textContent='Map initialization failed: '+e.message;}
}else{$('status').textContent='Map engine unavailable. Check internet access or publish via HTTPS. Directory is still usable.';}
</script></body></html>
