const center=[-92.4145,31.1785],$=id=>document.getElementById(id);

function directionsURL(name){

 // Google Maps will determine its own pedestrian route; this app does NOT draw an unverified path.

function directionsPanel(){

const savedPositions=(()=>{try{return JSON.parse(localStorage.getItem("lsua_verified_positions_v13")||"{}")}catch{return {}}})();const markerByName={};let map,tab='buildings',markers=[],selected=null;

function detail(name){const b=buildings.find(b=>b.name===name);if(!b)return;selected=b;tab='buildings';tabs();$('content').innerHTML=`<button id="back" class="soft">← All campus locations</button><h2>${esc(name)}</h2><p class="muted">${esc(b.category)} · Campus directory</p><div class="note">${savedPositions[name]?'Position adjusted locally on this device; not independently verified.':overviewPositions[name]?'Approximate position estimated from LSUA’s official campus overview. NOT verified as the correct satellite roof.':'This location has not yet been positioned on the map.'}</div><button id="buildingDirections" class="soft">Walking directions ↗</button><h3>See advisors and teachers in this building</h3><p class="muted">Individual advisor and faculty building assignments are not verified yet. Names are available under the Advisors tab; we will not assign them to the wrong building.</p><p class="muted">No office hours are shown.</p>`;$('back').onclick=()=>{selected=null;render()};$('buildingDirections').onclick=()=>{routeDestination=name;tab='directions';tabs();render()};if(map&&approxCoordinate(name))map.flyTo({center:approxCoordinate(name),zoom:18.2,duration:350})}
function render(){const q=$('search').value.toLowerCase().trim();if(tab==='buildings'){$('content').innerHTML='<h2>LSUA campus locations</h2><div class="legend">Colors indicate location type; see the map legend. Satellite imagery is real. Labels are locked. Locations use saved coordinates on this browser where available; others may be approximate.</div>'+buildings.filter(b=>(b.name+' '+b.category).toLowerCase().includes(q)).map(b=>`<div class="entry" data-building="${esc(b.name)}"><b>${esc(b.name)}</b><div class="muted">${esc(b.category)} · ${savedPositions[b.name]?'Position adjusted locally':overviewPositions[b.name]?'Approximate map label':'Directory only'}</div></div>`).join('');}else if(tab==='advisors'){$('content').innerHTML='<h2>Find an advisor</h2><p class="muted">Emails and phone numbers are sourced from <a href="'+advisingSource+'" target="_blank" rel="noopener noreferrer">LSUA’s official advising directory</a>. Specific office assignments and room numbers have not been confirmed on that page; contact the advisor before visiting. The <a href="'+officialCampusMap+'" target="_blank" rel="noopener noreferrer">LSUA campus map</a> identifies the Martin Family Student Success Center as a student support and academic advising hub.</p>'+advisors.filter(a=>a.join(' ').toLowerCase().includes(q)).map(a=>`<div class="entry"><b>${esc(a[0])}</b><div class="muted">${esc(a[1])}</div><a class="advisor-email" href="mailto:${esc(a[2])}">${esc(a[2])}</a>${a[3]?`<div class="muted"><a href="tel:${a[3]}">${esc(a[3])}</a></div>`:''}<div class="muted">Office room: not published in the advising directory</div><button class="soft" data-advising-route="1">Find advising center</button></div>`).join('');}else if(tab==='legend'){$('content').innerHTML='<h2>Campus map legend</h2><p class="muted">Browse locations by category. Select any location to see it on the map.</p>'+Object.entries(locationPalette).map(([category,p])=>{const items=buildings.filter(b=>b.category===category&&b.name.toLowerCase().includes(q));return `<section><h3 style="display:flex;align-items:center;gap:9px"><span class="legend-dot" style="background:${p.color};width:20px;height:20px"></span>${esc(legendNames[category]||category)} <small>(${items.length})</small></h3>${items.map(b=>`<div class="entry" data-building="${esc(b.name)}"><b>${esc(b.name)}</b></div>`).join('')||'<p class="muted">No matching locations</p>'}</section>`}).join('');}else{$('content').innerHTML=directionsPanel();const s=$('routeDestination'),a=$('routeLink');s.onchange=()=>{routeDestination=s.value;a.style.display=routeDestination?'inline-block':'none';if(routeDestination)a.href=directionsURL(routeDestination)};if(routeDestination)a.href=directionsURL(routeDestination);}}

function addCampusMarker(name,coord){
 if(!map||!coord||markerByName[name])return;
 const el=document.createElement('button');const category=buildings.find(b=>b.name===name)?.category;el.className='building-marker';el.textContent=name;
